name: Docker Build Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build Dockerfile
        run: |
          docker build -f Dockerfile.qwen-image-edit-runpod-v3.7.dockerfile -t qwen-edit-test .
